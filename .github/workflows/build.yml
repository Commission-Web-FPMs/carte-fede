name: Build and publish

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carte_fede_ci
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --encoding=UTF8
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carte_fede_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Backend synthetic privacy tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_log_privacy.py' -v
      - name: Backend request flow on disposable PostgreSQL 18 ICU
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:15432/carte_fede_ci
          SECRET_KEY: synthetic-ci-only-not-production
          AUTO_CREATE_DB: '1'
        run: python -m unittest discover -s tests -p 'test_requests.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend privacy checks and build
        working-directory: frontend
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm run build
          node scripts/prepare-runtime.mjs

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Publish both application images before updating GitOps.
      # ------------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend/
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-frontend:${{ github.sha }}

      # ------------------------------------------------------------
      # Auth GitHub App
      # ------------------------------------------------------------

      - name: Generate deployment GitHub App token
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: Commission-Web-FPMs
          repositories: |
            carte-fede-deployment
          permission-contents: write

      # On checkout main initialement car la branche correspondante
      # n'existe peut-être pas encore dans le repo GitOps.
      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          repository: Commission-Web-FPMs/carte-fede-deployment
          ref: main
          token: ${{ steps.deploy-token.outputs.token }}
          path: deployment
          fetch-depth: 0

      # ------------------------------------------------------------
      # Sélection/création de la branche GitOps
      # ------------------------------------------------------------

      - name: Checkout matching deployment branch
        working-directory: deployment
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git ls-remote \
            --exit-code \
            --heads origin \
            "refs/heads/${TARGET_BRANCH}" \
            > /dev/null 2>&1
          then
            echo "Branch '${TARGET_BRANCH}' exists"

            git fetch origin \
              "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

            git switch -C \
              "${TARGET_BRANCH}" \
              "origin/${TARGET_BRANCH}"
          else
            echo "Branch '${TARGET_BRANCH}' does not exist, creating from main"

            git switch -c \
              "${TARGET_BRANCH}" \
              "origin/main"
          fi

      # ------------------------------------------------------------
      # Update values.yaml
      # ------------------------------------------------------------

      - name: Update both image tags
        working-directory: deployment
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
        run: |
          python3 ../.github/scripts/update-deployment-images.py

      # ------------------------------------------------------------
      # Commit avec identité de la GitHub App
      # ------------------------------------------------------------

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          APP_SLUG: ${{ steps.deploy-token.outputs.app-slug }}
        run: |
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')"
          echo "id=${USER_ID}" >> "$GITHUB_OUTPUT"

      - name: Commit deployment version
        working-directory: deployment
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          APP_SLUG: ${{ steps.deploy-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email \
            "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add values.yaml

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA}"

          git push origin "${TARGET_BRANCH}"
