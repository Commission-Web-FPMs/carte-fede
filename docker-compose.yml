services:
  db:
    restart: always
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: membres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d membres"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    restart: always
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app

  frontend:
    restart: always
    build: ./frontend
    environment:
      PORT: "8080"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}

  nginx:
    restart: always
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
