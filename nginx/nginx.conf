worker_processes auto;

events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=registration:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=payment_qr:10m rate=10r/m;
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript application/json
             application/manifest+json application/xml image/svg+xml text/plain;

  upstream backend  { server backend:8000; }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
      try_files $uri $uri/ $uri.html /404.html;
      # Revalidate pages, the service worker and other unversioned public files.
      add_header Cache-Control "no-cache" always;
    }

    location /_astro/ {
      try_files $uri =404;
      # Astro fingerprints these assets; a new build gets new URLs.
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
      proxy_pass http://backend;          # <-- pas de :8000 ici
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location = /api/auth/register {
      limit_req zone=registration burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location = /api/card-payment/qr {
      limit_req zone=payment_qr burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
